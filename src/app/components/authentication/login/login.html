<div class="login-container min-h-screen flex flex-col relative overflow-hidden">

  <div class="animated-bg" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
    <div class="grid-overlay"></div>
  </div>


  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-sm shadow-sm relative z-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center py-4">
        <button type="button" routerLink="/" class="flex items-center space-x-2 hover:opacity-80 transition-opacity">
          <div class="p-2 bg-[#02ab74] rounded-lg">
            <lucide-angular class="w-6 h-6 text-white" name="bot"></lucide-angular>
          </div>
          <span class="text-xl font-semibold text-[#070025]">{{ 'login.headerTitle' | translate }}</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <div class="flex-1 flex items-center justify-center px-4 py-12 relative z-10">
    <div class="w-full max-w-md login-card-enter">
      <!-- Card -->
      <div class="bg-white/95 backdrop-blur rounded-2xl shadow-2xl p-8 border border-gray-100 card-hover">
        <!-- Icon -->
        <div class="flex justify-center mb-6">
          <div class="w-20 h-20">
            <app-eye-tracker [withBadge]="true" [badgePadding]="'16px'" [color]="'#ffffff'">
            </app-eye-tracker>
          </div>
        </div>
        <!-- Title -->
        <h1 class="text-center text-[#070025] text-2xl font-semibold mb-2">{{ 'login.title' | translate }}</h1>
        <p class="text-center text-gray-600 mb-8">{{ 'login.subtitle' | translate }}</p>
        <!-- Form -->
        <form [formGroup]="form" (ngSubmit)="onSubmitLogin()" class="space-y-5">
          <!-- Email Field -->
          <div class="space-y-2">
            <label for="email" class="block text-sm font-medium text-[#070025]">{{ 'login.email' | translate }}</label>
            <div class="relative">
              <lucide-angular class="absolute left-2 top-1/2 -translate-y-1/4 w-5 h-5 text-gray-400"
                name="mail"></lucide-angular>
              <input id="email" type="email" formControlName="email"
                [placeholder]="'login.emailPlaceholder' | translate" [attr.aria-label]="'login.email' | translate"
                aria-describedby="email-error" [attr.aria-invalid]="email?.invalid && email?.touched"
                class="w-full pl-10 pr-3 py-2.5 rounded-lg border border-gray-300 focus:border-[#02ab74] focus:ring-2 focus:ring-[#02ab74] focus:ring-offset-1 focus:outline-none transition-colors"
                [class.border-red-500]="email?.invalid && email?.touched"
                [class.focus:ring-red-500]="email?.invalid && email?.touched" autocomplete="username" />
            </div>
            @if (email?.invalid && email?.touched) {
            <div id="email-error" class="text-red-500 text-sm mt-1" role="alert">
              {{ emailError }}
            </div>
            }
          </div>

          <!-- Password Field -->
          <div class="space-y-2">
            <label for="password" class="block text-sm font-medium text-[#070025]">{{ 'login.password' | translate
              }}</label>
            <div class="relative">
              <lucide-angular class="absolute left-2 top-1/2 -translate-y-1/4 w-5 h-5 text-gray-400"
                name="lock"></lucide-angular>
              <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
                [placeholder]="'login.passwordPlaceholder' | translate" [attr.aria-label]="'login.password' | translate"
                aria-describedby="password-error" [attr.aria-invalid]="password?.invalid && password?.touched"
                class="w-full pl-10 pr-12 py-2.5 rounded-lg border border-gray-300 focus:border-[#02ab74] focus:ring-2 focus:ring-[#02ab74] focus:ring-offset-1 focus:outline-none transition-colors"
                [class.border-red-500]="password?.invalid && password?.touched"
                [class.focus:ring-red-500]="password?.invalid && password?.touched" autocomplete="current-password" />
              <button type="button" (click)="togglePasswordVisibility()"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none focus:text-gray-600 transition-colors"
                [attr.aria-label]="'login.showPassword' | translate">

              </button>
            </div>
            @if (password?.invalid && password?.touched) {
            <div id="password-error" class="text-red-500 text-sm mt-1" role="alert">
              {{ passwordError }}
            </div>
            }
          </div>
          <!-- Remember Me & Forgot Password -->
          <div class="flex items-center justify-between">
            <label class="flex items-center space-x-2 cursor-pointer">
              <input type="checkbox" formControlName="rememberMe"
                class="w-4 h-4 text-[#02ab74] border-gray-300 rounded focus:ring-2 focus:ring-[#02ab74] focus:ring-offset-1" />
              <span class="text-sm text-gray-600">{{ 'login.rememberMe' | translate }}</span>
            </label>
            <button type="button" (click)="password_reset()"
              class="text-sm text-[#02ab74] hover:text-[#028a5f] transition-colors font-medium focus:outline-none focus:underline">
              {{ 'login.forgotPassword' | translate }}
            </button>
          </div>

          <!-- Submit Button -->
          <button type="submit" [disabled]="isLoading || form.invalid"
            class="w-full bg-[#02ab74] hover:bg-[#028a5f] text-white font-medium rounded-lg py-2.5 sm:py-3 px-4 transition-all hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-[#02ab74] focus:ring-offset-2">
            @if (!isLoading) {
            <span>{{ 'login.submit' | translate }}</span>
            }
            @if (isLoading) {
            <span class="flex items-center justify-center">
              {{ 'login.submitting' | translate }}
            </span>
            }
          </button>
        </form>

        <!-- Divider -->
        <div class="relative my-6">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200"></div>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="px-4 bg-white text-gray-500">{{ 'login.orContinueWith' | translate }}</span>
          </div>
        </div>

        <!-- Social Login -->
        <!-- Social Login -->
        <div class="grid grid-cols-1 gap-3">
          <button type="button" (click)="loginWithGoogle()" [disabled]="isLoading"
            class="flex items-center justify-center rounded-lg border border-gray-300 hover:border-[#02ab74] hover:bg-gray-50 py-2.5 px-4 transition-colors disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus:ring-2 focus:ring-[#02ab74] focus:ring-offset-1">
            <svg class="w-5 h-5 mr-2" viewBox="0 0 24 24">
              <path fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
              <path fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
              <path fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
              <path fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            <span class="text-sm font-medium text-gray-700">Google</span>
          </button>
        </div>

        <!-- Sign Up Link -->
        <p class="text-center mt-6 text-sm text-gray-600">
          {{ 'login.noAccount' | translate }}
          <button type="button" (click)="register()"
            class="text-[#02ab74] hover:text-[#028a5f] font-medium transition-colors focus:outline-none focus:underline">
            {{ 'login.register' | translate }}
          </button>
        </p>
      </div>
    </div>
  </div>
</div>
