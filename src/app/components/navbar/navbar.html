<div class="h-screen bg-gray-50 dark:bg-gray-950 font-sans flex flex-col md:flex-row">

  <!-- TOPBAR (Visible SÓLO en Móvil) -->
  <header
    class="md:hidden z-40 fixed top-0 w-full flex items-center justify-between px-6 py-4 shadow-md bg-white dark:bg-gray-900 border-b border-gray-100 dark:border-gray-800 transition-all duration-300">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-gradient-to-br from-[#02ab74] to-[#7209b7] rounded-lg shadow-sm">
        <div class="w-6 h-6">
          <app-eye-tracker [color]="'#ffffff'"></app-eye-tracker>
        </div>
      </div>
      <h1 class="text-lg font-bold tracking-wide text-[#070025] dark:text-white">Curim AI</h1>
    </div>

    <button class="p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-white/10 rounded-lg transition-colors focus:outline-none"
      (click)="toggleMobileMenu()" aria-label="Toggle Menu">
      <lucide-angular [name]="isMobileMenuOpen ? 'x' : 'menu'" class="w-6 h-6"></lucide-angular>
    </button>
  </header>

  <!-- BACKDROP (Fondo Oscuro para Móvil) -->
  @if (isMobileMenuOpen) {
  <div class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-40 md:hidden transition-opacity"
    (click)="toggleMobileMenu()" aria-hidden="true">
  </div>
  }

  <!-- MAIN APP WRAPPER -->
  <div class="flex flex-1 w-full pt-[73px] md:pt-0 min-h-0">

    <!-- SIDEBAR -->
    <nav
      class="sidebar fixed md:relative z-50 top-0 left-0 h-full bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 shadow-2xl md:shadow-none flex flex-col flex-shrink-0 transition-all duration-300 ease-in-out overflow-hidden"
      [ngClass]="[
        isMobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0',
        isCollapsed ? 'md:w-20' : 'md:w-72',
        'w-72'
      ]">

      <!-- HEADER -->
      <div class="h-20 px-4 flex items-center border-b border-gray-200 dark:border-gray-800 flex-shrink-0">
        <!-- Logo: visible solo expandido -->
        @if (!isCollapsed) {
        <div class="flex items-center gap-3 flex-1 min-w-0">
          <div
            class="p-2.5 bg-gradient-to-br from-[#02ab74] via-[#02ab74] to-[#7209b7] rounded-xl shadow-lg transition-transform group-hover:scale-110">
            <div class="w-6 h-6">
              <app-eye-tracker [color]="'#ffffff'"></app-eye-tracker>
            </div>
          </div>
          <h1 class="text-xl font-bold tracking-tight text-gray-900 dark:text-white whitespace-nowrap">
            CURIM
          </h1>
        </div>
        }

        <!-- Botón colapsar (escritorio) -->
        <button (click)="toggleCollapse()"
          class="hidden md:flex items-center justify-center w-10 h-10 rounded-lg text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-white/10 transition-colors flex-shrink-0"
          [ngClass]="isCollapsed ? 'mx-auto' : ''"
          [attr.aria-label]="isCollapsed ? 'Expandir menú' : 'Colapsar menú'">
          <lucide-angular [name]="isCollapsed ? 'menu' : 'chevron-left'" class="w-5 h-5"></lucide-angular>
        </button>

        <!-- Botón cierre (móvil) -->
        <button (click)="toggleMobileMenu()"
          class="md:hidden flex items-center justify-center w-10 h-10 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors flex-shrink-0 ml-auto">
          <lucide-angular name="x" class="w-5 h-5"></lucide-angular>
        </button>
      </div>

      <!-- NAV ITEMS -->
      <div class="flex-1 overflow-y-auto overflow-x-hidden px-3 py-4 space-y-1">
        @for (item of visibleNavItems; track item) {
        <button
          class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl transition-colors duration-200 group"
          [ngClass]="{
            'bg-[#02ab74]/10 text-[#02ab74]': activeItem === item.id,
            'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-white/5 hover:text-gray-900 dark:hover:text-white': activeItem !== item.id,
            'justify-center': isCollapsed
          }"
          (click)="setActive(item.id)"
          (mouseenter)="showTooltip($event, item)"
          (mouseleave)="hideTooltip()">

          <!-- Icono -->
          <lucide-angular [name]="item.icon" class="w-5 h-5 flex-shrink-0"
            [ngClass]="activeItem === item.id ? 'text-[#02ab74]' : ''">
          </lucide-angular>

          <!-- Label: solo visible expandido -->
          @if (!isCollapsed) {
          <span class="text-sm font-medium whitespace-nowrap">
            {{ item.label | translate }}
          </span>
          }
        </button>
        }
      </div>

      <!-- FOOTER -->
      <div class="flex-shrink-0 px-3 py-4 border-t border-gray-200 dark:border-gray-800 space-y-2">

        <!-- Avatar usuario -->
        @if (user) {
        <div class="flex items-center gap-3 px-2 py-2 rounded-xl transition-colors"
          [ngClass]="isCollapsed ? 'justify-center' : 'bg-gray-100 dark:bg-white/5'">

          <!-- Avatar (componente) -->
          <div class="flex-shrink-0 flex items-center justify-center">
            <app-profile-avatar [size]="2"></app-profile-avatar>
          </div>

          <!-- Info del usuario: solo visible expandido -->
          @if (!isCollapsed) {
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium text-gray-900 dark:text-white truncate">
              {{ user.name || 'Usuario' }}
            </p>
            <p class="text-xs text-gray-500 dark:text-gray-400 truncate">
              {{ user.email || '' }}
            </p>
          </div>
          }
        </div>
        }

        <!-- Logout -->
        <button
          class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-red-500 hover:bg-red-100 dark:hover:bg-red-800/10 transition-colors"
          [ngClass]="{ 'justify-center': isCollapsed }"
          (click)="logout()" [disabled]="isLoggingOut">
          <lucide-angular name="log-out" class="w-5 h-5 flex-shrink-0"></lucide-angular>
          @if (!isCollapsed) {
          <span class="text-sm font-medium whitespace-nowrap">
            {{ isLoggingOut ? ('navbar.loggingOut' | translate) : ('navbar.logout' | translate) }}
          </span>
          }
        </button>
      </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL (Router Outlet) -->
    <main class="content flex-1 overflow-y-auto overflow-x-hidden relative min-w-0">
      <div class="w-full min-h-full p-6 md:p-8 lg:p-10">
        <div class="max-w-[1600px] mx-auto w-full min-h-full">
          <router-outlet></router-outlet>
        </div>
      </div>
    </main>
  </div>

  <!-- TOOLTIP FLOTANTE (fuera del nav, no lo corta el overflow) -->
  @if (tooltip.visible && isCollapsed) {
  <div
    class="fixed z-[100] px-3 py-1.5 bg-gray-900 dark:bg-gray-700 text-white text-xs font-medium rounded-lg shadow-lg whitespace-nowrap pointer-events-none transition-opacity duration-150"
    [style.top.px]="tooltip.top"
    [style.left.px]="tooltip.left"
    style="transform: translateY(-50%);">
    {{ tooltip.text }}
  </div>
  }
</div>
